name: Code Style Check

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: C++ Code Style (clang-format)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y --no-install-recommends clang-format-19 2>/dev/null; then
            echo "Installing clang-format-19 from LLVM apt repository..."
            sudo apt-get install -y --no-install-recommends wget lsb-release software-properties-common gnupg
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 19
            sudo apt-get install -y clang-format-19
            sudo ln -sf /usr/bin/clang-format-19 /usr/bin/clang-format
          else
            sudo ln -sf /usr/bin/clang-format-19 /usr/bin/clang-format
          fi

      - name: Verify clang-format version
        run: clang-format --version

      - name: Inspect code style
        run: |
          echo "Scanning C++ headers and sources for style violations..."
          VIOLATIONS=0
          FILES=$(find include src modules -type f \( -name "*.h" -o -name "*.cpp" \))

          if [ -z "$FILES" ]; then
            echo "No C++ files found to inspect."
            exit 0
          fi

          for file in $FILES; do
            if ! clang-format --dry-run --Werror "$file" 2>&1; then
              echo "::error file=$file::Style violation detected in $file"
              diff -u "$file" <(clang-format "$file") || true
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          if [ $VIOLATIONS -eq 0 ]; then
            echo "All C++ files conform strictly to .clang-format specifications."
          else
            echo "Total files with formatting violations: $VIOLATIONS"
            echo "To format automatically, run: find include src modules -type f \( -name \"*.h\" -o -name \"*.cpp\" \) | xargs clang-format -i"
            exit 1
          fi
